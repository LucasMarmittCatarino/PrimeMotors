name: Run Jest Tests (Docker)

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build da imagem Docker (pasta backend)
        run: docker build -t primemotors-api-test ./backend

      - name: Rodar seed + jest no mesmo container
        run: |
          docker run --rm primemotors-api-test sh -c "
            node src/seed.js &&
            npm test
          "