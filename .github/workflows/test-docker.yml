name: Run Jest Tests (Docker)

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build da imagem Docker (pasta backend)
        run: docker build -t primemotors-api-test ./backend

      - name: Rodar seed + jest no mesmo container (com env)
        run: |
          docker run --rm \
            -e JWT_SECRET=testsecret \
            -e TOKEN_EXPIRES_IN=1h \
            primemotors-api-test sh -c "
              node src/seed.js &&
              npm test
            "