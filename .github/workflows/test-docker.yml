name: Run Jest Tests (Docker)

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t primemotors-api-test .

      - name: Rodar testes dentro do container
        run: docker run --rm primemotors-api-test npm test
